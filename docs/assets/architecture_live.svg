<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" width="100%" height="100%" style="background-color: #0d1117; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <style>
      .packet-flow {
        stroke-dasharray: 4 8;
        animation: flow 1.5s linear infinite;
      }
      .packet-flow-reverse {
        stroke-dasharray: 4 8;
        animation: flow-rev 1.5s linear infinite;
      }
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flow-rev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      
      .box {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 6;
      }
      .box-header {
        font-size: 13px;
        font-weight: 600;
        fill: #c9d1d9;
      }
      .box-sub {
        font-size: 11px;
        fill: #8b949e;
      }
      .section-title {
        font-size: 11px;
        font-weight: 700;
        fill: #8b949e;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .line {
        fill: none;
        stroke: #30363d;
        stroke-width: 2;
      }
      .line-active {
        fill: none;
        stroke: #58a6ff;
        stroke-width: 2;
      }
      .line-media {
        fill: none;
        stroke: #3fb950;
        stroke-width: 2;
      }
    </style>
  </defs>

  <!-- Titles -->
  <text x="50" y="40" class="section-title">Client Layer</text>
  <text x="300" y="40" class="section-title">Edge Gateway</text>
  <text x="550" y="40" class="section-title">Application Services</text>
  <text x="800" y="40" class="section-title">Data &amp; Media Plane</text>

  <!-- Connecting Lines (Base) -->
  <path d="M 230 115 L 300 235" class="line" />
  <path d="M 230 235 L 300 235" class="line" />
  <path d="M 230 355 L 300 235" class="line" />
  
  <path d="M 480 235 L 550 115" class="line" />
  <path d="M 480 235 L 550 235" class="line" />
  <path d="M 480 235 L 550 355" class="line" />

  <path d="M 730 115 L 800 115" class="line" />
  <path d="M 730 235 L 800 235" class="line" />
  <path d="M 730 355 L 800 355" class="line" />
  
  <!-- Direct WebRTC Media Line -->
  <path d="M 140 150 C 140 180, 140 180, 140 200" class="line" stroke-dasharray="2 4" />

  <!-- Animated Data Flow Overlays -->
  <path d="M 230 115 L 300 235" class="line-active packet-flow" />
  <path d="M 230 235 L 300 235" class="line-active packet-flow" />
  <path d="M 230 355 L 300 235" class="line-active packet-flow" />

  <path d="M 480 235 L 550 115" class="line-active packet-flow" />
  <path d="M 480 235 L 550 235" class="line-active packet-flow" />
  <path d="M 480 235 L 550 355" class="line-active packet-flow" />

  <path d="M 730 115 L 800 115" class="line-active packet-flow" />
  <path d="M 730 235 L 800 235" class="line-media packet-flow" />
  <path d="M 730 355 L 800 355" class="line-active packet-flow" />

  <!-- Column 1: Clients -->
  <g transform="translate(50, 80)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">Doctor Workspace</text>
    <text x="15" y="46" class="box-sub">React / Vite</text>
    <text x="15" y="60" class="box-sub">WebRTC Tele-Clinic</text>
  </g>

  <g transform="translate(50, 200)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">Patient Portal</text>
    <text x="15" y="46" class="box-sub">React / PWA</text>
    <text x="15" y="60" class="box-sub">Offline Sync Outbox</text>
  </g>

  <g transform="translate(50, 320)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">Pharmacy &amp; Admin</text>
    <text x="15" y="46" class="box-sub">React / Vite</text>
    <text x="15" y="60" class="box-sub">Verification &amp; Dispensing</text>
  </g>

  <!-- Column 2: Edge -->
  <g transform="translate(300, 200)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">API Gateway</text>
    <text x="15" y="46" class="box-sub">HTTPS / WSS Termination</text>
    <text x="15" y="60" class="box-sub">OIDC &amp; Rate Limiting</text>
  </g>

  <!-- Column 3: Services -->
  <g transform="translate(550, 80)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">Core API Service</text>
    <text x="15" y="46" class="box-sub">Node.js / Express</text>
    <text x="15" y="60" class="box-sub">REST Endpoints</text>
  </g>

  <g transform="translate(550, 200)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">WebRTC Signalling</text>
    <text x="15" y="46" class="box-sub">Socket.IO Server</text>
    <text x="15" y="60" class="box-sub">Peer Connection Negotiation</text>
  </g>

  <g transform="translate(550, 320)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">Clinical AI Engine</text>
    <text x="15" y="46" class="box-sub">Gemini 2.0 Integration</text>
    <text x="15" y="60" class="box-sub">SOAP Scribe / CDSS</text>
  </g>

  <!-- Column 4: Data & Media -->
  <g transform="translate(800, 80)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">PostgreSQL Store</text>
    <text x="15" y="46" class="box-sub">Neon Serverless</text>
    <text x="15" y="60" class="box-sub">Drizzle ORM</text>
  </g>

  <g transform="translate(800, 200)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">TURN Media Relay</text>
    <text x="15" y="46" class="box-sub">coturn Server</text>
    <text x="15" y="60" class="box-sub">NAT Traversal (UDP/TCP)</text>
  </g>

  <g transform="translate(800, 320)">
    <rect width="180" height="70" class="box" />
    <text x="15" y="28" class="box-header">Object Storage</text>
    <text x="15" y="46" class="box-sub">Encrypted Bucket</text>
    <text x="15" y="60" class="box-sub">Prescriptions &amp; Labs</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 420)">
    <rect width="930" height="30" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="15" y="20" class="box-sub" fill="#c9d1d9">
      LEGEND: <tspan fill="#58a6ff">──</tspan> SECURE DATA FLOW (HTTPS/WSS) &nbsp;&nbsp;&nbsp; <tspan fill="#3fb950">──</tspan> MEDIA PACKET ROUTING &nbsp;&nbsp;&nbsp; <tspan fill="#8b949e">--</tspan> DIRECT P2P MESH
    </text>
  </g>
</svg>
